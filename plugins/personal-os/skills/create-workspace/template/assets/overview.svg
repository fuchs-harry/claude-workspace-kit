<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Do you want to start with Claude Code?</title>
  <desc id="d">The Claude Workspace Kit sets up your AI workspace: it remembers you, keeps projects in order, writes in your voice, runs automations, teaches you Claude Code and stays safe by default. The Personal OS plugin adds daily commands. Result: you never explain yourself twice.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
    <style>
      .k { font: 700 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6B6B6B; letter-spacing: 1.5px; }
      .h { font: 700 32px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111111; }
      .sub { font: 400 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #444444; }
      .ct { font: 700 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111111; }
      .cb { font: 400 13.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #333333; }
      .cbi { font: italic 400 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #333333; }
      .cm { font: 600 12.5px ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #555555; }
      .cmd { font: 600 14px ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #111111; }
      .cmdd { font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #555555; }
      .num { font: 700 13px ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #FFFFFF; }
      .band { font: 600 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .bandk { font: 700 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="758" rx="24" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <text x="48" y="58" class="k">CLAUDE WORKSPACE KIT</text>
  <text x="48" y="98" class="h">Do you want to start with Claude Code?</text>
  <text x="48" y="128" class="sub">This kit sets up your AI workspace in 10 minutes. It remembers you, keeps your work in order and sounds like you. No coding needed.</text>

  <!-- You -->
  <text x="48" y="172" class="k">YOU</text>
  <rect x="48" y="184" width="200" height="416" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="148" y="232" class="ct" text-anchor="middle">You talk</text>
  <text x="148" y="256" class="cb" text-anchor="middle">in plain language</text>
  <line x1="72" y1="284" x2="224" y2="284" stroke="#DDDDDD"/>
  <text x="148" y="322" class="cbi" text-anchor="middle">"Plan my week"</text>
  <text x="148" y="352" class="cbi" text-anchor="middle">"Reply to Jonas"</text>
  <text x="148" y="382" class="cbi" text-anchor="middle">"New project:</text>
  <text x="148" y="401" class="cbi" text-anchor="middle">coffee pop-up"</text>
  <text x="148" y="431" class="cbi" text-anchor="middle">"What did we</text>
  <text x="148" y="450" class="cbi" text-anchor="middle">decide last week?"</text>
  <line x1="72" y1="490" x2="224" y2="490" stroke="#DDDDDD"/>
  <text x="148" y="520" class="cmdd" text-anchor="middle">Desktop app (Code tab),</text>
  <text x="148" y="540" class="cmdd" text-anchor="middle">terminal, VS Code</text>
  <text x="148" y="560" class="cmdd" text-anchor="middle">or claude.ai/code</text>

  <line x1="252" y1="392" x2="292" y2="392" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Workspace pillars -->
  <text x="300" y="172" class="k">YOUR WORKSPACE DOES</text>

  <rect x="300" y="184" width="290" height="124" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="316" y="200" width="24" height="24" rx="6" fill="#111111"/><text x="328" y="217" class="num" text-anchor="middle">1</text>
  <text x="350" y="218" class="ct">Remembers you</text>
  <text x="316" y="246" class="cb">Your profile, rules and decisions are</text>
  <text x="316" y="265" class="cb">loaded every session, auto-updated.</text>
  <text x="316" y="292" class="cm">CLAUDE.md · context/</text>

  <rect x="610" y="184" width="290" height="124" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="626" y="200" width="24" height="24" rx="6" fill="#111111"/><text x="638" y="217" class="num" text-anchor="middle">2</text>
  <text x="660" y="218" class="ct">Keeps projects in order</text>
  <text x="626" y="246" class="cb">A few questions, then a ready folder</text>
  <text x="626" y="265" class="cb">with goal, status, docs and outputs.</text>
  <text x="626" y="292" class="cm">/new-project · projects/</text>

  <rect x="300" y="330" width="290" height="124" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="316" y="346" width="24" height="24" rx="6" fill="#111111"/><text x="328" y="363" class="num" text-anchor="middle">3</text>
  <text x="350" y="364" class="ct">Sounds like you</text>
  <text x="316" y="392" class="cb">The voice-keeper learns how you write;</text>
  <text x="316" y="411" class="cb">texts come out authentic, not AI-speak.</text>
  <text x="316" y="438" class="cm">/draft · /voice · voice.json</text>

  <rect x="610" y="330" width="290" height="124" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="626" y="346" width="24" height="24" rx="6" fill="#111111"/><text x="638" y="363" class="num" text-anchor="middle">4</text>
  <text x="660" y="364" class="ct">Runs by itself</text>
  <text x="626" y="392" class="cb">Hooks for macOS, Linux and Windows:</text>
  <text x="626" y="411" class="cb">session check, auto-save, notifications.</text>
  <text x="626" y="438" class="cm">/setup-hooks · .claude/hooks/</text>

  <rect x="300" y="476" width="290" height="124" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="316" y="492" width="24" height="24" rx="6" fill="#111111"/><text x="328" y="509" class="num" text-anchor="middle">5</text>
  <text x="350" y="510" class="ct">Teaches you Claude Code</text>
  <text x="316" y="538" class="cb">Hands-on tour with an example project,</text>
  <text x="316" y="557" class="cb">12 short lessons, an onboarding guide.</text>
  <text x="316" y="584" class="cm">/start-here · /tour · /onboarding-help</text>

  <rect x="610" y="476" width="290" height="124" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="626" y="492" width="24" height="24" rx="6" fill="#111111"/><text x="638" y="509" class="num" text-anchor="middle">6</text>
  <text x="660" y="510" class="ct">Safe by default</text>
  <text x="626" y="538" class="cb">Allow / ask / deny rules. Nothing sent,</text>
  <text x="626" y="557" class="cb">published or deleted without your OK.</text>
  <text x="626" y="584" class="cm">.claude/settings.json</text>

  <line x1="904" y1="392" x2="944" y2="392" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Plugin -->
  <text x="952" y="172" class="k">PERSONAL OS PLUGIN</text>
  <rect x="952" y="184" width="200" height="416" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="972" y="220" class="cmd">/today</text><text x="972" y="238" class="cmdd">3 priorities for the day</text>
  <text x="972" y="268" class="cmd">/dump</text><text x="972" y="286" class="cmdd">empty your head, sorted</text>
  <text x="972" y="316" class="cmd">/weekly-review</text><text x="972" y="334" class="cmdd">done, stuck, next week</text>
  <text x="972" y="364" class="cmd">/decide</text><text x="972" y="382" class="cmdd">clear recommendation</text>
  <text x="972" y="412" class="cmd">/learn</text><text x="972" y="430" class="cmdd">links into notes + actions</text>
  <text x="972" y="460" class="cmd">/focus</text><text x="972" y="478" class="cmdd">one task, 25-min steps</text>
  <text x="972" y="508" class="cmd">/draft · /voice</text><text x="972" y="526" class="cmdd">texts in your voice</text>
  <text x="972" y="556" class="cmd">/create-workspace</text><text x="972" y="574" class="cmdd">all of this, one command</text>

  <!-- Result -->
  <rect x="48" y="628" width="1104" height="84" rx="16" fill="#111111"/>
  <text x="76" y="676" class="bandk">Result</text>
  <text x="150" y="676" class="band">Never explain yourself twice  ·  tidy projects  ·  texts that sound like you  ·  safe automation</text>
</svg>
